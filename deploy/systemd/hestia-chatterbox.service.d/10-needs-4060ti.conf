# Voice runs on the 4060 Ti. When that card is out of the box (it was lent out 2026-10-20), a
# start from boot, a render script or a person is skipped cleanly instead of crash-looping.
# Nothing to undo when the card returns.
[Service]
ExecCondition=/bin/sh -c 'nvidia-smi -L 2>/dev/null | grep -q "4060 Ti"'
