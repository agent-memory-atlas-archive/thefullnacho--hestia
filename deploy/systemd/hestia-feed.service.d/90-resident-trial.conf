# Resident trial: Gemma 4 12B, using the evaluated conversation/tool settings.
# Rank with the brain's resident model and window, so the nightly run doesn't swap models.
# Remove it alongside the brain's drop-in when the trial ends.
[Service]
Environment=HESTIA_MODEL=gemma4:12b
Environment=HESTIA_THINK=0
Environment=HESTIA_NUM_CTX=32768
