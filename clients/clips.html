<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hestia Clips">
<meta name="theme-color" content="#0e0f13">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
<title>Hestia Clips</title>
<style>
  :root { --bg:#0e0f13; --panel:#16181f; --line:#232631; --text:#e8eaf0; --muted:#8b90a0; --accent:#d98a4b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header h1 span { color:var(--accent); }
  #chips { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; border-bottom:1px solid var(--line); }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:6px 12px; font-size:13px; }
  .chip.on { color:var(--text); border-color:var(--accent); }
  .chip.warn.on { border-color:#f0556a; color:#f0556a; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; padding:12px 16px 32px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .thumb { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#000; }
  .body { padding:8px 10px 10px; }
  .note { font-size:13px; margin:0 0 4px; }
  .note.empty { color:var(--muted); font-style:italic; }
  .meta { font-size:11px; color:var(--muted); }
  .badge { display:inline-block; font-size:10px; color:#f0556a; border:1px solid #f0556a; border-radius:4px; padding:1px 5px; margin-left:6px; }
  video, audio { width:100%; display:block; background:#000; }
  #empty { text-align:center; color:var(--muted); padding:48px 20px; }
</style>
</head>
<body>
<header><h1>Hestia <span>clips</span></h1></header>
<div id="chips"></div>
<div id="grid"></div>
<div id="empty" hidden>No clips yet — save one from the Share Sheet shortcut.</div>
<script>
const grid = document.getElementById('grid'), chipsEl = document.getElementById('chips'), emptyEl = document.getElementById('empty');
let clips = [], activeTag = '', needsOnly = false;

function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load(){
  const p = new URLSearchParams();
  if (activeTag) p.set('tag', activeTag);
  if (needsOnly) p.set('needs_note', '1');
  const r = await fetch('/api/clips' + (p.toString() ? '?' + p : ''));
  const j = await r.json();
  clips = j.clips || [];
  renderChips(); render();
}
function renderChips(){
  const tags = [...new Set(clips.flatMap(c => (c.tags||'').split(',').map(t=>t.trim()).filter(Boolean)))].sort();
  let h = `<button class="chip${!activeTag&&!needsOnly?' on':''}" data-t="">All</button>`;
  h += `<button class="chip warn${needsOnly?' on':''}" data-needs="1">needs note</button>`;
  h += tags.map(t => `<button class="chip${activeTag===t?' on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  chipsEl.innerHTML = h;
  chipsEl.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    if (b.dataset.needs) { needsOnly = !needsOnly; activeTag=''; }
    else { activeTag = (activeTag === b.dataset.t) ? '' : b.dataset.t; needsOnly = false; }
    load();
  });
}
function render(){
  emptyEl.hidden = clips.length > 0;
  grid.innerHTML = clips.map(c => {
    const media = c.thumb_url
      ? `<img class="thumb" src="${c.thumb_url}" loading="lazy" alt="">`
      : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:28px;">${c.is_audio ? '&#9836;' : '&#127916;'}</div>`;
    const note = c.note ? `<p class="note">${esc(c.note)}</p>` : `<p class="note empty">no note yet</p>`;
    const badge = c.needs_note ? `<span class="badge">needs note</span>` : '';
    const when = fmtDate(c.taken_at || c.created_at);
    return `<div class="card" data-id="${c.id}">${media}<div class="body">${note}
      <div class="meta">${esc(c.sender||'')} &middot; ${when}${badge}</div></div></div>`;
  }).join('');
  grid.querySelectorAll('.card').forEach(card => card.onclick = () => togglePlay(card));
}
function togglePlay(card){
  const id = card.dataset.id, c = clips.find(x => String(x.id) === id);
  if (!c || !c.file_url) return;
  const old = card.querySelector('video, audio');
  if (old) { card.querySelector('.thumb, div.thumb').style.display=''; old.remove(); return; }
  const el = document.createElement(c.is_audio ? 'audio' : 'video');
  el.src = c.file_url; el.controls = true; el.playsInline = true;
  card.prepend(el);
  const th = card.querySelector('.thumb'); if (th) th.style.display = 'none';
  el.play().catch(()=>{});
}
load();
</script>
</body>
</html>
